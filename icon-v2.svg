<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean white background with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- White rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bgGradient)"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#ffffff"/>
  
  <!-- Robot Head (gradient purple) -->
  <rect x="38" y="30" width="52" height="46" rx="10" fill="url(#robotGradient)"/>
  
  <!-- Antenna with glow -->
  <line x1="64" y1="20" x2="64" y2="30" stroke="url(#robotGradient)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="18" r="4" fill="#10b981"/>
  <circle cx="64" cy="18" r="6" fill="#10b981" opacity="0.3"/>
  
  <!-- Eyes (glowing cyan circles) -->
  <circle cx="50" cy="48" r="7" fill="#06b6d4"/>
  <circle cx="78" cy="48" r="7" fill="#06b6d4"/>
  <!-- Eye glow effect -->
  <circle cx="50" cy="48" r="10" fill="#06b6d4" opacity="0.2"/>
  <circle cx="78" cy="48" r="10" fill="#06b6d4" opacity="0.2"/>
  <!-- Eye shine -->
  <circle cx="52" cy="46" r="2.5" fill="#ffffff"/>
  <circle cx="80" cy="46" r="2.5" fill="#ffffff"/>
  
  <!-- Friendly smile -->
  <path d="M 48 62 Q 64 70 80 62" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Code symbol on chest (white) -->
  <g transform="translate(0, 8)">
    <!-- Background panel -->
    <rect x="44" y="82" width="40" height="30" rx="6" fill="#f1f5f9"/>
    
    <!-- </> symbol in purple -->
    <path d="M 52 92 L 47 97 L 52 102" stroke="url(#robotGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 76 92 L 81 97 L 76 102" stroke="url(#robotGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 68 90 L 60 104" stroke="url(#robotGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Quality checkmark badge (bottom right) -->
  <circle cx="98" cy="98" r="14" fill="#10b981"/>
  <circle cx="98" cy="98" r="17" fill="#10b981" opacity="0.2"/>
  <path d="M 92 98 L 96 102 L 104 92" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Subtle dots decoration (tech feel) -->
  <circle cx="20" cy="64" r="2" fill="#cbd5e1"/>
  <circle cx="108" cy="64" r="2" fill="#cbd5e1"/>
  <circle cx="64" cy="115" r="2" fill="#cbd5e1"/>
</svg>
