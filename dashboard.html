<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDevPilot - Swarm Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .dashboard-header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .dashboard-header p {
            color: #94a3b8;
            font-size: 1.1em;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card h3 {
            font-size: 2em;
            color: #60a5fa;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #94a3b8;
            font-size: 0.9em;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .agent-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .agent-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .agent-card.active {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .agent-card.working {
            border-color: #f59e0b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }

        .agent-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .agent-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .agent-description {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .agent-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .agent-status.idle {
            background: rgba(100, 100, 100, 0.3);
            color: #94a3b8;
        }

        .agent-status.working {
            background: rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }

        .agent-status.complete {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .agent-results {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 0.85em;
            display: none;
        }

        .agent-card.has-results .agent-results {
            display: block;
        }

        .run-agent-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        .run-agent-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
        }

        .run-agent-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .fix-agent-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .fix-agent-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.5);
        }

        .fix-agent-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .control-panel h2 {
            color: #60a5fa;
            margin-bottom: 20px;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .control-btn.primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .control-btn.secondary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .control-btn.danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            max-height: 500px;
            overflow-y: auto;
        }

        .results-panel h2 {
            color: #60a5fa;
            margin-bottom: 20px;
        }

        .result-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #60a5fa;
        }

        .result-item.error {
            border-left-color: #ef4444;
        }

        .result-item.success {
            border-left-color: #10b981;
        }

        .result-item.warning {
            border-left-color: #f59e0b;
        }

        .result-time {
            color: #94a3b8;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .result-message {
            color: #e0e0e0;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>🤖 AIDevPilot Swarm Dashboard</h1>
        <p>8 AI Agents Working Together to Fix Your Code</p>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <h3 id="total-scans">0</h3>
            <p>Total Scans</p>
        </div>
        <div class="stat-card">
            <h3 id="issues-found">0</h3>
            <p>Issues Found</p>
        </div>
        <div class="stat-card">
            <h3 id="issues-fixed">0</h3>
            <p>Issues Fixed</p>
        </div>
        <div class="stat-card">
            <h3 id="deployments">0</h3>
            <p>Deployments</p>
        </div>
    </div>

    <div class="control-panel">
        <h2>🎯 Control Center</h2>
        <div class="control-buttons">
            <button class="control-btn primary" onclick="runFullSwarm()">
                ▶️ Run Full Swarm
            </button>
            <button class="control-btn primary" onclick="fixAll()">
                🔧 Fix All Issues
            </button>
            <button class="control-btn secondary" onclick="scanCurrentFile()">
                🔍 Scan Current File
            </button>
            <button class="control-btn danger" onclick="stopAllAgents()">
                ⏹️ Stop All Agents
            </button>
        </div>
        <div class="progress-bar" id="swarm-progress">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="agents-grid" id="agents-grid">
        <!-- Agents will be populated by JavaScript -->
    </div>

    <div class="results-panel">
        <h2>📊 Recent Activity</h2>
        <div id="results-log">
            <div class="result-item success">
                <div class="result-time">Just now</div>
                <div class="result-message">✅ Dashboard initialized - All agents ready</div>
            </div>
        </div>
    </div>

    <script>
        const agents = [
            {
                id: 'bughunter',
                name: 'BugHunter',
                icon: '🔍',
                description: 'Detects issues, placeholders, and code smells',
                status: 'idle',
                results: null
            },
            {
                id: 'backupfinder',
                name: 'BackupFinder',
                icon: '📚',
                description: 'Locates working versions in backups and git history',
                status: 'idle',
                results: null
            },
            {
                id: 'codemerger',
                name: 'CodeMerger',
                icon: '⚔️',
                description: 'Merges working code from backups into broken files',
                status: 'idle',
                results: null
            },
            {
                id: 'inputvalidator',
                name: 'InputValidator',
                icon: '🧹',
                description: 'Validates all user inputs and sanitizes data',
                status: 'idle',
                results: null
            },
            {
                id: 'formhardener',
                name: 'FormHardener',
                icon: '🔐',
                description: 'Adds CSRF protection to all POST forms',
                status: 'idle',
                results: null
            },
            {
                id: 'uienhancer',
                name: 'UIEnhancer',
                icon: '🎨',
                description: 'Improves UX with modern design patterns',
                status: 'idle',
                results: null
            },
            {
                id: 'securityguard',
                name: 'SecurityGuard',
                icon: '🛡️',
                description: 'Blocks deployment if vulnerabilities detected',
                status: 'idle',
                results: null
            },
            {
                id: 'productiondeployer',
                name: 'ProductionDeployer',
                icon: '🚀',
                description: 'Deploys approved code to production server',
                status: 'idle',
                results: null
            }
        ];

        let stats = {
            totalScans: 0,
            issuesFound: 0,
            issuesFixed: 0,
            deployments: 0
        };

        function renderAgents() {
            const grid = document.getElementById('agents-grid');
            grid.innerHTML = agents.map(agent => `
                <div class="agent-card ${agent.status !== 'idle' ? agent.status : ''} ${agent.results ? 'has-results' : ''}" 
                     id="agent-${agent.id}">
                    <span class="agent-icon">${agent.icon}</span>
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-description">${agent.description}</div>
                    <span class="agent-status ${agent.status}">${agent.status.toUpperCase()}</span>
                    ${agent.results ? `
                        <div class="agent-results">
                            <strong>Results:</strong><br>
                            ${agent.results}
                        </div>
                    ` : ''}
                    <button class="run-agent-btn" onclick="runAgent('${agent.id}')" 
                            ${agent.status === 'working' ? 'disabled' : ''}>
                        🔍 Scan
                    </button>
                    <button class="fix-agent-btn" onclick="fixAgent('${agent.id}')" 
                            ${agent.status === 'working' ? 'disabled' : ''}>
                        🔧 Fix Issues
                    </button>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('total-scans').textContent = stats.totalScans;
            document.getElementById('issues-found').textContent = stats.issuesFound;
            document.getElementById('issues-fixed').textContent = stats.issuesFixed;
            document.getElementById('deployments').textContent = stats.deployments;
        }

        function addLog(message, type = 'success') {
            const log = document.getElementById('results-log');
            const time = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = `result-item ${type}`;
            item.innerHTML = `
                <div class="result-time">${time}</div>
                <div class="result-message">${message}</div>
            `;
            log.insertBefore(item, log.firstChild);
            
            // Keep only last 10 items
            while (log.children.length > 10) {
                log.removeChild(log.lastChild);
            }
        }

        async function runAgent(agentId) {
            const agent = agents.find(a => a.id === agentId);
            if (!agent) return;

            agent.status = 'working';
            renderAgents();
            
            addLog(`${agent.icon} ${agent.name} started scanning...`, 'warning');

            // Simulate agent work
            setTimeout(() => {
                const randomIssues = Math.floor(Math.random() * 10);
                agent.status = 'complete';
                agent.results = `Found ${randomIssues} issues`;
                stats.issuesFound += randomIssues;
                renderAgents();
                updateStats();
                addLog(`${agent.icon} ${agent.name} completed - ${randomIssues} issues found`, 'success');

                // Reset after 3 seconds
                setTimeout(() => {
                    agent.status = 'idle';
                    renderAgents();
                }, 3000);
            }, 2000);
        }

        async function fixAgent(agentId) {
            const agent = agents.find(a => a.id === agentId);
            if (!agent) return;

            agent.status = 'working';
            renderAgents();
            
            addLog(`🔧 ${agent.icon} ${agent.name} fixing issues...`, 'warning');

            // Simulate fix work
            setTimeout(() => {
                const randomFixes = Math.floor(Math.random() * 8) + 1;
                agent.status = 'complete';
                agent.results = `Fixed ${randomFixes} issues`;
                stats.issuesFixed += randomFixes;
                renderAgents();
                updateStats();
                addLog(`✅ ${agent.icon} ${agent.name} fixed ${randomFixes} issues`, 'success');

                // Reset after 3 seconds
                setTimeout(() => {
                    agent.status = 'idle';
                    renderAgents();
                }, 3000);
            }, 3000);
        }

        async function fixAll() {
            addLog('🔧 Fix All - running full swarm with auto-fix...', 'warning');
            stats.totalScans++;
            updateStats();

            const progressBar = document.getElementById('progress-fill');
            let totalFixed = 0;
            
            for (let i = 0; i < agents.length; i++) {
                progressBar.style.width = ((i + 1) / agents.length * 100) + '%';
                
                const agent = agents[i];
                agent.status = 'working';
                renderAgents();
                
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                const fixes = Math.floor(Math.random() * 5) + 1;
                totalFixed += fixes;
                agent.status = 'complete';
                agent.results = `Fixed ${fixes} issues`;
                stats.issuesFixed += fixes;
                renderAgents();
                addLog(`✅ ${agent.icon} ${agent.name} fixed ${fixes} issues`, 'success');
                
                await new Promise(resolve => setTimeout(resolve, 500));
                agent.status = 'idle';
                renderAgents();
            }

            setTimeout(() => {
                progressBar.style.width = '0%';
                addLog(`🎉 Fix All complete! Fixed ${totalFixed} total issues`, 'success');
                stats.deployments++;
                updateStats();
            }, 500);
        }

        async function runFullSwarm() {
            addLog('🎯 Running full swarm sequence...', 'warning');
            stats.totalScans++;
            updateStats();

            const progressBar = document.getElementById('progress-fill');
            
            for (let i = 0; i < agents.length; i++) {
                progressBar.style.width = ((i + 1) / agents.length * 100) + '%';
                await new Promise(resolve => {
                    setTimeout(() => {
                        runAgent(agents[i].id);
                        resolve();
                    }, 500);
                });
                await new Promise(resolve => setTimeout(resolve, 2500));
            }

            setTimeout(() => {
                progressBar.style.width = '0%';
                addLog('✅ Full swarm scan complete!', 'success');
                stats.deployments++;
                updateStats();
            }, 1000);
        }

        function scanCurrentFile() {
            addLog('🔍 Scanning current file...', 'warning');
            runAgent('bughunter');
        }

        function stopAllAgents() {
            agents.forEach(agent => {
                agent.status = 'idle';
                agent.results = null;
            });
            renderAgents();
            document.getElementById('progress-fill').style.width = '0%';
            addLog('⏹️ All agents stopped', 'error');
        }

        // Initialize
        renderAgents();
        updateStats();
    </script>
</body>
</html>
