<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>
  
  <!-- Robot Head -->
  <g id="robot">
    <!-- Antenna -->
    <line x1="64" y1="25" x2="64" y2="18" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="64" cy="15" r="3" fill="#fbbf24"/>
    
    <!-- Head/Face -->
    <rect x="42" y="30" width="44" height="40" rx="6" fill="url(#robotGradient)" stroke="#4f46e5" stroke-width="2"/>
    
    <!-- Eyes (glowing) -->
    <circle cx="52" cy="45" r="5" fill="#60a5fa">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="76" cy="45" r="5" fill="#60a5fa">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Smile/Display panel -->
    <rect x="48" y="55" width="32" height="10" rx="2" fill="#1e293b" opacity="0.3"/>
    
    <!-- Code symbols on display -->
    <text x="52" y="63" font-family="monospace" font-size="10" fill="#10b981" font-weight="bold">&lt;/&gt;</text>
  </g>
  
  <!-- Robot Body -->
  <g id="body">
    <!-- Main body -->
    <rect x="48" y="72" width="32" height="28" rx="4" fill="url(#robotGradient)" stroke="#4f46e5" stroke-width="2"/>
    
    <!-- Chest panel with code -->
    <rect x="52" y="76" width="24" height="20" rx="2" fill="#1e293b" opacity="0.2"/>
    
    <!-- Status lights -->
    <circle cx="56" cy="82" r="2" fill="#10b981"/>
    <circle cx="64" cy="82" r="2" fill="#3b82f6"/>
    <circle cx="72" cy="82" r="2" fill="#a855f7"/>
    
    <!-- Binary code on chest -->
    <text x="54" y="92" font-family="monospace" font-size="6" fill="#6366f1">101010</text>
  </g>
  
  <!-- Arms -->
  <g id="arms" fill="url(#robotGradient)" stroke="#4f46e5" stroke-width="2">
    <!-- Left arm -->
    <rect x="35" y="75" width="10" height="20" rx="3"/>
    <!-- Right arm -->
    <rect x="83" y="75" width="10" height="20" rx="3"/>
  </g>
  
  <!-- Pilot wings/badge -->
  <g id="wings" fill="#fbbf24" opacity="0.9">
    <!-- Left wing -->
    <path d="M 40 90 L 30 92 L 35 96 Z"/>
    <!-- Right wing -->
    <path d="M 88 90 L 98 92 L 93 96 Z"/>
    <!-- Center badge -->
    <circle cx="64" cy="92" r="3" fill="#10b981" stroke="#fbbf24" stroke-width="1"/>
  </g>
  
  <!-- Checkmark on badge -->
  <path d="M 62 92 L 63.5 93.5 L 66 90.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Circuit/tech details -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.15" fill="none">
    <!-- Top circuits -->
    <line x1="25" y1="35" x2="35" y2="35"/>
    <line x1="93" y1="35" x2="103" y2="35"/>
    <circle cx="22" cy="35" r="2"/>
    <circle cx="106" cy="35" r="2"/>
    
    <!-- Side circuits -->
    <line x1="25" y1="65" x2="35" y2="65"/>
    <line x1="93" y1="65" x2="103" y2="65"/>
  </g>
</svg>
